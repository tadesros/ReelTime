name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ master ]      # change to master if that's your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish BlazorLayout.csproj -c Release -o release

      - name: Set base href for /BlazorLayout/
        run: sed -i 's|<base href="/"|<base href="/BlazorLayout/"|' release/wwwroot/index.html

      - name: SPA fallback (deep links like /counter)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
