<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Chrome fill: bright top, horizon line, darker lower band, light bottom edge -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#9aa3ad"/>
      <stop offset="0.52" stop-color="#c3c9d0"/>
      <stop offset="0.8" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#a7afb8"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5b6672" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#7fd3ff"/>
      <stop offset="0.6" stop-color="#1a8cff"/>
      <stop offset="1" stop-color="#0a4fbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1f6fd1"/>
      <stop offset="1" stop-color="#06162e"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Letter shapes (upright; italic applied by group transform) -->
    <path id="T" d="M90,150 H300 V215 H232 V380 H158 V215 H90 Z"/>
    <path id="D" fill-rule="evenodd" d="M318,150 H455 Q545,150 545,240 V290 Q545,380 455,380 H318 Z
             M390,212 H448 Q472,212 472,236 V294 Q472,318 448,318 H390 Z"/>
  </defs>

  <!-- Circuit traces -->
  <g fill="none" stroke="#1e88e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)">
    <path d="M40,260 H95 L115,240"/>
    <path d="M70,330 H120 L140,350 H210"/>
    <path d="M60,410 H150 L170,395"/>
    <path d="M250,110 H330 L350,90 H470"/>
    <path d="M400,70 H520 L540,90 V120"/>
    <path d="M560,250 H610"/>
    <path d="M520,420 H600 L615,405"/>
    <path d="M290,430 H420"/>
  </g>
  <g fill="#4fb3ff" filter="url(#softglow)">
    <circle cx="40" cy="260" r="6"/><circle cx="70" cy="330" r="5"/><circle cx="210" cy="350" r="5"/>
    <circle cx="60" cy="410" r="5"/><circle cx="250" cy="110" r="5"/><circle cx="470" cy="90" r="6"/>
    <circle cx="400" cy="70" r="5"/><circle cx="540" cy="120" r="5"/><circle cx="610" cy="250" r="6"/>
    <circle cx="615" cy="405" r="5"/><circle cx="290" cy="430" r="5"/><circle cx="420" cy="430" r="5"/>
  </g>
  <!-- small code bracket accent -->
  <text x="560" y="75" font-family="Consolas, monospace" font-size="26" fill="#4fb3ff" filter="url(#softglow)">&lt;/&gt;</text>

  <g transform="translate(55,0) skewX(-12)">
    <!-- blue aura -->
    <g fill="#1a7dff" opacity="0.75" filter="url(#glow)">
      <use href="#T"/><use href="#D"/>
    </g>
    <!-- dark outline + drop shadow -->
    <g fill="#0a0f1a" stroke="#0a0f1a" stroke-width="22" stroke-linejoin="round" filter="url(#shadow)">
      <use href="#T"/><use href="#D"/>
    </g>
    <!-- thin blue edge -->
    <g fill="none" stroke="#2f8cff" stroke-width="10" stroke-linejoin="round">
      <use href="#T"/><use href="#D"/>
    </g>
    <g fill="#0a0f1a" stroke="#0a0f1a" stroke-width="5" stroke-linejoin="round">
      <use href="#T"/><use href="#D"/>
    </g>
    <!-- glowing interior of D counter -->
    <rect x="390" y="212" width="82" height="106" rx="24" fill="url(#inner)"/>
    <!-- chrome face -->
    <g fill="url(#chrome)" fill-rule="evenodd">
      <use href="#T"/><use href="#D"/>
    </g>
    <!-- bevel highlight -->
    <g fill="none" stroke="url(#bevel)" stroke-width="3" stroke-linejoin="round">
      <use href="#T"/><use href="#D"/>
    </g>
    <!-- energy orb inside D -->
    <clipPath id="counter"><rect x="390" y="212" width="82" height="106" rx="24"/></clipPath>
    <g clip-path="url(#counter)">
      <circle cx="431" cy="265" r="46" fill="url(#orb)"/>
      <circle cx="431" cy="265" r="9" fill="#ffffff"/>
    </g>
  </g>
</svg>
