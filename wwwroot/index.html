<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor Layout</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!--Boostrap CSS-->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />

    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--DevIcons-->
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!--Google fonts Bebause for Headlines Monterass 300 or 400 for body-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Custom CSS-->
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="BlazorLayout.styles.css" rel="stylesheet" />

    <!--Favicon-->
    <link rel="icon" type="image/png" href="favicon.png" />



    <script type="importmap"></script>
</head>

<body data-cf-theme="green">
    <!-- This is the App component where get's injected'-->
    <!-- Defaults to Spinning-->
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>
    <!-- End of App Component-->

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Bootstrap JS bundle (includes Popper) -->
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.setTheme = (theme) => {
            const el = document.querySelector('[data-cf-theme]');
            if (!el) {
                console.error('No element found with data-cf-theme');
                return;
            }

            el.setAttribute('data-cf-theme', theme);
        };
    </script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</body>

</html>
